<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
    <nav>
        <img src="" alt="">
    </nav>
    <main>
        <h1>Dishes</h1>
        <aside id="add-dish-form">
            <h2>Add Dish</h2>
        </aside>
        <input type="text" id="search_dish">
        <button id="search_button">Search</button>
        <div id="confirmation-window" style="display: none;">
            <h2 id="delete-message"></h2>
            <button id="confirm-button">Confirm</button>
            <button id="cancel-button">Cancel</button>
        </div>
        <div id="container">
            <table id="dish-table">
                <tr>
                    <th>Dish ID</th>
                    <th>Dish Name</th>
                    <th>Ingredients</th>
                    <th>Preparation Steps</th>
                    <th>Cooking Time (min)</th>
                    <th>Origin</th>
                    <th>Spice Level</th>
                </tr>

            </table>
        </div>

        <!--
        <form action="http://localhot:5000/api/dishes" method="post" id="dish_form">
            <input type="text" id="name" name="name" required>
            <input type="text" id="description" name="description" required>
        </form>
        <button id="submit_button">Submit</button>
        -->
    </main>

    <script src="/scripts/script.js"></script>
</body>
 
</html>
